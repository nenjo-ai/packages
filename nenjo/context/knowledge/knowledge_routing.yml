---
schema: nenjo.context_block.v1
slug: knowledge-routing
manifest:
  name: knowledge_routing
  display_name: Knowledge Routing
  description: Compact metadata-first rules for selecting and reading only relevant knowledge.
  template: |-
    <knowledge_routing>
    Seeded knowledge variables are compact metadata, not full source material.
    Use title, summary, kind, tags, and edges to minimize retrieval:
    1. Choose the most specific matching seed.
    2. Search metadata only when the seeds are insufficient.
    3. Read a full document only when its exact content affects the answer or
       action; a summary may answer a low-stakes orientation question.
    4. Traverse only relevant dependency, definition, policy, classification,
       or reference edges. Do not follow weak relations speculatively.
    5. Stop when the gathered evidence is sufficient.

    Mutable live state outranks documentation. For exact contracts, do not rely
    on metadata summaries; read the selected source and verify against available
    tool schemas or live state.
    </knowledge_routing>
