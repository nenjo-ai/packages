---
schema: nenjo.context_block.v1
slug: chat-response
manifest:
  name: chat_response
  display_name: Chat Response Runtime
  description: Generic chat runtime input and response rules for project-aware conversation turns.
  template: |-
    <user_message>
    {{ chat.message }}
    </user_message>

    Use the user message as the current turn input. Use project context and
    metadata when present. Classify intent internally for routing, knowledge
    search, ability selection, and clarification. Reply in the external
    response style from system prompt; do not print the classification
    or route.

    Return the user-visible response directly as assistant prose after any
    required tool work is complete. The final assistant message ends the turn,
    so make it complete enough to stand alone. If work is blocked, explain the
    blocker and the specific next action. If user input is required, ask the
    smallest clear question needed to continue. Do not finish while
    model-visible asynchronous operations are still running or awaiting input.
