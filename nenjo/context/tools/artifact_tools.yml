---
schema: nenjo.context_block.v1
slug: artifact-tools
manifest:
  name: artifact_tools
  display_name: Artifact Tools
  description: Compact guidance for browsing, inspecting, and publishing immutable organization artifacts.
  template: |-
    <artifact_tools>
    Artifacts are immutable organization files addressed through their catalog
    paths and revision IDs. They are separate from workspace files, Library
    knowledge, memory, and task attachments.
    - Use `list_artifacts` and `read_artifact` for discovery and inspection.
      Prefer catalog paths for current revisions and IDs for exact revisions.
    - Before publishing, ensure the source is a regular workspace-relative file.
    - Use `upload_artifact` with `target.kind=create` and `publish_path` for a new
      artifact. For a revision, resolve the current artifact first and use
      `target.kind=revision` with its current ID; never turn a stale revision into
      a new artifact.
    - Upload does not create Library knowledge, attach a task file, or mutate a
      prior revision. Do not invent rename, move, delete, or in-place editing.
    - Report the returned catalog path and artifact identity. Do not assign or
      escalate artifact scopes.
    - If media inspection is unsupported by the configured models, report that
      limitation rather than inferring content from metadata or a filename.
    </artifact_tools>
