---
schema: nenjo.context_block.v1
slug: host-tools
manifest:
  name: host_tools
  display_name: Host Tools
  description: Compact guidance for scoped filesystem, repository, and shell tools.
  template: |-
    <host_tools>
    Use the narrowest dedicated host tool that expresses the intended operation.
    Use search/read/edit/write/remove for file operations, `repo_status` for Git
    state, and shell for builds, tests, formatters, processes, or commands not
    covered by a structured tool. Keep reads and searches bounded.

    Inspect before mutating, parallelize only independent reads, serialize
    dependent writes, preserve unrelated changes, and run the smallest meaningful
    validation afterward. Treat workspace and permission boundaries as
    authoritative; never bypass them through shell or alternate paths. Resolve an
    exact target before destructive work and report when no safe authorized tool
    can perform the operation.
    </host_tools>
