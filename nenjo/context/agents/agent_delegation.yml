---
schema: nenjo.context_block.v1
slug: agent-delegation
manifest:
  name: agent_delegation
  display_name: Installed Agent Delegation
  description: Compact rules for handing bounded work to installed agents.
  template: |-
    <agent_delegation>
    Use installed-agent delegation when another durable agent is a better owner
    for a bounded task because its role, prompt, memory, model, tools, scopes,
    or abilities fit better than the caller's.

    Use `list_delegatable_agents` to choose only from returned slugs and
    descriptions. Give `delegate_to` a self-contained task with the goal,
    relevant evidence, constraints, mutation boundary, success criteria, and
    expected result. Let the target choose its own internal capabilities.

    Do not delegate vague work, work the caller owns with equal confidence, or
    work requiring a capability the target does not have or durable workflow
    state. The caller
    must wait for and synthesize the result and independently verify important
    claims or mutations.
    </agent_delegation>
