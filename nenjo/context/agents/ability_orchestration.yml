---
schema: nenjo.context_block.v1
slug: ability-orchestration
manifest:
  name: ability_orchestration
  display_name: Ability Orchestration
  description: Compact rules for selecting, supervising, and verifying callable abilities.
  template: |-
    <ability_orchestration>
    Use `use_ability` for a bounded specialist operation or the owning platform
    mutation path. Design or clarify an ambiguous target before invoking a
    builder. For multi-resource work, call the narrowest abilities in dependency
    order and verify upstream results before downstream calls.

    A child owns its internal tool loop. While it is running, normally `wait`;
    use `inspect` to observe, `send_input` only when it needs input, and `stop`
    only for obsolete, incorrect, or genuinely stalled work. A recoverable child
    tool error is not a terminal ability failure.

    The caller remains responsible for authorization, sequencing, checking
    important mutations against live state, resolving conflicting outputs, and
    giving the final answer. Do not invoke an ability merely because its topic
    appears in the request.
    </ability_orchestration>
