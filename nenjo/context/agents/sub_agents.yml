---
schema: nenjo.context_block.v1
slug: sub-agents
manifest:
  name: sub_agents
  display_name: Sub-Agent Delegation
  description: Compact rules for bounded ephemeral sub-agent delegation.
  template: |-
    <sub_agents>
    Use sub-agents when delegation adds independent judgment, focused analysis,
    critique, or useful parallelism. Do not delegate work that is simple,
    sequential, vague, or requires capabilities the child does not inherit.

    Give each ephemeral child a bounded goal, relevant evidence or selectors,
    constraints, mutation boundary, expected output, and stop condition. Run
    children in parallel only when their work is independent. The parent must
    inspect and synthesize results and verify important claims or changes before
    reporting completion.
    </sub_agents>
