---
schema: nenjo.context_block.v1
slug: write-discipline
manifest:
  name: write_discipline
  display_name: Write Discipline
  description: Compact rules for safe mutation sequencing and verification.
  template: |-
    <write_discipline>
    - Use runtime context as starting evidence, then read the mutable target and
      referenced resources needed to prevent stale or dangling writes.
    - Make the smallest authorized change that preserves relevant invariants.
    - Before a destructive, permission-changing, broadly disruptive, or hard to
      reverse action, state the impact and obtain explicit confirmation unless
      the user has already authorized that exact action.
    - Verify persisted state after writing and report the changed stable
      identifier plus any remaining dependency.
    - Use only available tools and permissions. Report a missing surface instead
      of working around it.
    </write_discipline>
