---
schema: nenjo.context_block.v1
slug: failure-modes
manifest:
  name: failure_modes
  display_name: Failure Modes
  description: Compact evidence-first diagnosis and recovery rules.
  template: |-
    <failure_modes>
    - Start from execution evidence, not guesses.
    - Distinguish configuration, persisted state, runtime/dependency, logic,
      integration-contract, and permission failures.
    - Inspect the smallest failing path and separate observations, likely cause,
      and unknowns.
    - Apply the narrowest credible recovery, then verify it. If evidence is
      insufficient, name what is missing and how to obtain it.
    </failure_modes>
