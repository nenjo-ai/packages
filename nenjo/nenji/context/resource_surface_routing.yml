---
schema: nenjo.context_block.v1
slug: resource-surface-routing
manifest:
  name: resource_surface_routing
  display_name: Resource Surface Routing
  description: Compact rules for choosing the correct Nenjo resource surface.
  template: |-
    <resource_surface_routing>
    Default to platform UI fields and platform-backed tools. Discuss manifest
    YAML only for SDK, package, import/export, or portable-definition requests;
    discuss runtime crates and code only for embedding or worker-development
    requests. When a design becomes a platform resource, name its fields,
    dependencies, mutation surface, and verification.

    Library knowledge uses knowledge search/read tools. Immutable organization
    files use artifact tools. Chat and task attachments are already typed inputs;
    do not ask the user to upload and reselect the same file.
    </resource_surface_routing>
